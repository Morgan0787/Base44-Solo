<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" width="100%" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">UniMatch — matching engine overview</title>
  <desc id="hero-desc">A student profile with GPA, IELTS, and TOPIK scores flows into a matching engine, producing a ranked list of universities with admission chance percentages.</desc>

  <rect x="0" y="0" width="1200" height="400" fill="#FFFFFF"/>

  <!-- Wordmark + tagline -->
  <text x="60" y="72" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="700" fill="#111827">UniMatch</text>
  <text x="60" y="104" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#6B7280">Find universities you can actually get into — ranked by real admission chance.</text>

  <line x1="60" y1="128" x2="1140" y2="128" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Node 1: Profile -->
  <g transform="translate(60,170)">
    <rect x="0" y="0" width="270" height="160" rx="10" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
    <text x="20" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="1.5" fill="#6B7280">STUDENT PROFILE</text>
    <text x="20" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#111827">GPA&#160;&#160;&#160;&#160;3.6</text>
    <text x="20" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#111827">IELTS&#160;&#160;6.5</text>
    <text x="20" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#111827">TOPIK&#160;&#160;4</text>
  </g>

  <!-- Arrow 1 -->
  <g stroke="#111827" stroke-width="1.5" fill="none">
    <line x1="335" y1="250" x2="410" y2="250"/>
    <path d="M400,242 L412,250 L400,258" fill="none"/>
  </g>

  <!-- Node 2: Matching engine -->
  <g transform="translate(420,170)">
    <rect x="0" y="0" width="270" height="160" rx="10" fill="#111827"/>
    <text x="20" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="1.5" fill="#9CA3AF">MATCHING ENGINE</text>
    <text x="20" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#FFFFFF">Compares your profile</text>
    <text x="20" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#FFFFFF">against verified admission</text>
    <text x="20" y="124" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#FFFFFF">requirements per university</text>
  </g>

  <!-- Arrow 2 -->
  <g stroke="#111827" stroke-width="1.5" fill="none">
    <line x1="695" y1="250" x2="770" y2="250"/>
    <path d="M760,242 L772,250 L760,258" fill="none"/>
  </g>

  <!-- Node 3: Ranked results -->
  <g transform="translate(780,170)">
    <rect x="0" y="0" width="360" height="160" rx="10" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
    <text x="20" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="1.5" fill="#6B7280">RANKED MATCHES</text>

    <text x="20" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#111827">TU Delft — NL</text>
    <text x="320" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" fill="#0F8A6B" text-anchor="end">72%</text>

    <text x="20" y="94" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#111827">Yonsei Univ. — KR</text>
    <text x="320" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" fill="#B58A2E" text-anchor="end">41%</text>

    <text x="20" y="128" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#111827">Babson College — US</text>
    <text x="320" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" fill="#B54B3A" text-anchor="end">34%</text>
  </g>
</svg>
